[package]
name = "winmux-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WinMux desktop UI (Tauri 2)"

[lib]
name = "winmux_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
winmux-shared = { path = "../../winmux-shared" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
# tauri-plugin-updater = "2"  # відкладено: mingw ld "export ordinal too large"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
open = "5"
portable-pty = "0.8"
ureq = { version = "2", features = ["tls", "json"], default-features = false }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
